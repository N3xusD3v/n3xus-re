server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # O Traefik do Coolify recebe em http; redirecionar com host/porta absolutos quebraria atrás do túnel.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|avif|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
